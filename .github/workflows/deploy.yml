name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは1つだけ。実行中のものは完了させる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ブラウザが古いCSS/JSを使い続けないよう、コミットIDを付けて配信する。
      # （ビルド工程は無し。index.html の ?v=dev を置換するだけ）
      - name: Stamp cache-busting version
        run: |
          VER="${GITHUB_SHA::7}"
          sed -i "s/?v=dev/?v=${VER}/g" index.html
          echo "版: ${VER}  (置換 $(grep -o "?v=${VER}" index.html | wc -l) 箇所)"

      # 素の HTML / CSS / JS をそのまま配信する。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
